<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Office documents often request Windows/public-document Chinese family names.
       Map them to installed open-source CJK fonts so LibreOffice renders reliably. -->

  <alias binding="same"><family>宋体</family><prefer><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>NSimSun</family><prefer><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></prefer></alias>

  <alias binding="same"><family>仿宋</family><prefer><family>AR PL SungtiL GB</family><family>cwTeX Fangsong</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>仿宋_GB2312</family><prefer><family>AR PL SungtiL GB</family><family>cwTeX Fangsong</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>FangSong</family><prefer><family>AR PL SungtiL GB</family><family>cwTeX Fangsong</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>FangSong_GB2312</family><prefer><family>AR PL SungtiL GB</family><family>cwTeX Fangsong</family><family>Noto Serif CJK SC</family></prefer></alias>

  <alias binding="same"><family>楷体</family><prefer><family>AR PL KaitiM GB</family><family>AR PL UKai CN</family><family>cwTeX Kai</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>楷体_GB2312</family><prefer><family>AR PL KaitiM GB</family><family>AR PL UKai CN</family><family>cwTeX Kai</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>KaiTi</family><prefer><family>AR PL KaitiM GB</family><family>AR PL UKai CN</family><family>cwTeX Kai</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>KaiTi_GB2312</family><prefer><family>AR PL KaitiM GB</family><family>AR PL UKai CN</family><family>cwTeX Kai</family><family>Noto Serif CJK SC</family></prefer></alias>

  <alias binding="same"><family>黑体</family><prefer><family>WenQuanYi Zen Hei</family><family>cwTeX Hei</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>WenQuanYi Zen Hei</family><family>cwTeX Hei</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>WenQuanYi Zen Hei</family><family>cwTeX Hei</family><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>微软雅黑</family><prefer><family>WenQuanYi Zen Hei</family><family>cwTeX Hei</family><family>Noto Sans CJK SC</family></prefer></alias>

  <alias binding="same"><family>方正小标宋简体</family><prefer><family>Noto Serif CJK SC</family><family>AR PL UMing CN</family></prefer></alias>
  <alias binding="same"><family>小标宋</family><prefer><family>Noto Serif CJK SC</family><family>AR PL UMing CN</family></prefer></alias>

  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family><family>Nimbus Roman</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>TimesNewRoman</family><prefer><family>Liberation Serif</family><family>Nimbus Roman</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>新罗马</family><prefer><family>Liberation Serif</family><family>Nimbus Roman</family><family>DejaVu Serif</family></prefer></alias>
</fontconfig>
